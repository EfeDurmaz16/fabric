[package]
name = "fabric-bridge"
version = "0.1.0"
description = "The bridge to a provider worker (ADR 0021): protocol v1 messages and their framing"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The request digest, under its own domain; fabric-core already hashes
# commands with it, so no new crate enters the workspace.
blake3 = "1.8"
fabric-client = { path = "../fabric-client" }
fabric-core = { path = "../fabric-core" }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
