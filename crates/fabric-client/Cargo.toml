[package]
name = "fabric-client"
version = "0.1.0"
description = "The client API of a Fabric node: typed requests, replies, events and refusals over the control socket, and a client"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fabric-core = { path = "../fabric-core" }
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "net"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
