[package]
# The product name is not final. A rename changes this name, the binary's
# name below and `NAME` in src/lib.rs, and nothing else in the code.
name = "fabric-sync"
version = "0.1.0"
description = "Push and pull a working tree, with its uncommitted work and its caches, to a directory or over SSH"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Named fault points, for the crate's own crash tests only.
faults = ["dep:rustix"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fabric-core = { path = "../fabric-core" }
# Only to read the secret patterns and caches `.fabric/env.toml` declares.
fabric-env = { path = "../fabric-env" }
fabric-store = { path = "../fabric-store" }
# Only the fault points use it: a process that reaches one kills itself
# with SIGKILL, as a crash would stop it, without the crash report abort makes.
rustix = { version = "1.1", features = ["process"], optional = true }
serde_json = "1.0"
thiserror = "2.0"
# Chunks travel as the store keeps them, one zstd frame each; the receiver
# decompresses under a bound and checks the hash, as fabric-net does.
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
# The crash tests run this package's binary with the fault points built in.
fabric-sync = { path = ".", features = ["faults"] }
tempfile = "3.27"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fabric-sync"
path = "src/main.rs"

[lints]
workspace = true
