[package]
name = "fabric-core"
version = "0.1.0"
description = "Core types of Fabric: ids, the job ledger, the lease, snapshot manifests, the environment spec and the secret policy"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
ulid = { version = "3.0", default-features = false }
unicode-normalization = "0.1"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3.27"

[lints]
workspace = true
