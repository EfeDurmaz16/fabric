# Both pnpm-lock.yaml and package-lock.json exist; this file decides.
package_manager = "pnpm"
env = ["OPENAI_API_KEY", "DATABASE_URL"]
secret_patterns = ["*.sqlite"]

[tools]
node = "22.23.2"

[[cache]]
path = "dist"
class = "build"

[[setup]]
program = "pnpm"
args = ["install", "--frozen-lockfile"]

[[setup]]
program = "pnpm"
args = ["run", "codegen"]
when = "always"
