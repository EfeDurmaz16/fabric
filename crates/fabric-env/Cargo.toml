[package]
name = "fabric-env"
version = "0.1.0"
description = "Environment of a Fabric job: EnvSpec detection, the override file and materialization"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
fabric-core = { path = "../fabric-core" }
rustix = "1.1"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde", "preserve_order"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
