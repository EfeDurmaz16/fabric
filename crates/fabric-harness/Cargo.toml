[package]
name = "fabric-harness"
version = "0.1.0"
description = "Harness adapters: capture, restore and launch a Claude Code, Codex or ACP agent session"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["acp", "claude", "codex"]
# The generic Agent Client Protocol adapter.
acp = []
# The Claude Code adapter.
claude = ["dep:uuid"]
# The Codex adapter.
codex = ["dep:zstd"]
# Named crash points in capture and restore, for the crash tests only.
crashpoints = []

[dependencies]
blake3 = "1.8"
fabric-core = { path = "../fabric-core" }
regex = "1.13"
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"], optional = true }
zstd = { version = "0.14", optional = true }

[dev-dependencies]
# The crash tests stop capture and restore at named steps; this turns the
# steps on for test builds only, with the feature set the build asked for.
fabric-harness = { path = ".", default-features = false, features = ["crashpoints"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
zstd = "0.14"

[[test]]
name = "acp_roundtrip"
required-features = ["acp"]

[[test]]
name = "claude_roundtrip"
required-features = ["claude"]

[[test]]
name = "codex_roundtrip"
required-features = ["codex"]

[[test]]
name = "crash"
required-features = ["claude", "codex"]

[lints]
workspace = true
