[package]
name = "fabric-harness"
version = "0.1.0"
description = "Harness adapters: capture, restore and launch a Claude Code, Codex or ACP agent session"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["acp", "claude", "codex"]
# The generic Agent Client Protocol adapter.
acp = []
# The Claude Code adapter.
claude = ["dep:uuid"]
# The Codex adapter.
codex = ["dep:zstd"]

[dependencies]
fabric-core = { path = "../fabric-core" }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.28", features = ["v4"], optional = true }
zstd = { version = "0.14", optional = true }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3.27"

# A fake ACP agent the integration tests start as a subprocess. It is a test
# fixture, built only so `CARGO_BIN_EXE_fake-acp-agent` exists for the tests.
[[bin]]
name = "fake-acp-agent"
path = "fixtures/fake_acp_agent/main.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
