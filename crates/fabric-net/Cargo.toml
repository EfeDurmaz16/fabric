[package]
name = "fabric-net"
version = "0.1.0"
description = "Node identity, pinned TLS, the QUIC and TCP transports, framing, typed RPC and the peer book of Fabric"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["quic", "tcp_tls"]
quic = ["dep:quinn"]
tcp_tls = ["dep:tokio-rustls"]
mdns = ["dep:mdns-sd"]

[dependencies]
ed25519-dalek = { version = "3.0", features = ["alloc", "pkcs8"] }
fabric-core = { path = "../fabric-core" }
mdns-sd = { version = "0.21", default-features = false, features = ["async"], optional = true }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tracing = "0.1"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread"] }

[lints]
workspace = true
