[[change]]
date = "2026-10-28"
why = "Perf items 5, 8, 9, 10 and 18 of docs/evidence/perf-ab/README.md, in fabric-store: a restore runs git bundle unbundle without a git bundle verify before it, unbundles only the links of the chain the node's bundle cache lacks, writes the exclude file and the remote and branch config without asking git, and sets symbolic refs and HEAD in the update-ref transaction; a capture reads a bundle's heads from its header instead of running git bundle list-heads. Suspends 27/29 (one git fewer), resumes 9/10 and pulls 41/41 (8 to 14 fewer), and a resume no longer grows with the job's history. Counted on the store change alone and on the integration of every M2 deferred-work branch, which agree. Baselines unchanged"

[[change]]
