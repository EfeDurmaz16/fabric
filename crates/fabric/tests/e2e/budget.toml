# The time budget of the hot paths, which `budget::hot_paths` in budget.rs
# measures (issue #26): suspend, move, resume and pull of a job under each
# harness, and a daemon's cold start and restart. CONTRIBUTING.md says how
# to run it and how to change it. scripts/check-budget.sh fails a change to
# this file that adds no [[change]] entry at its end, or that loosens a
# limit: a baseline is the anchor's time and only goes down.

# A time is over its limit when it is above both ratio x baseline and
# baseline + grace_ms; it fails when it is over again in a second batch.
ratio = 1.3
grace_ms = 50
# Timed runs per batch, after the warm-up runs.
reps = 7
# The time that stands for a batch, as a percentile of its runs.
percentile = 25

# Each op's baseline in ms: the anchor's time at `percentile` on that
# platform, which only goes down. A platform with no baselines only
# reports its times. macOS: the Mac of the [[change]] entries below.
[baseline.macos-aarch64]
"acp suspend" = 342
"acp move" = 144
"acp resume" = 545
"acp pull" = 995
"claude suspend" = 407
"claude move" = 145
"claude resume" = 684
"claude pull" = 1221
"codex suspend" = 550
"codex move" = 144
"codex resume" = 836
"codex pull" = 1486
"cold start" = 57
"restart" = 78

# Linux: CI's ubuntu-latest runner, from scripts/budget-baselines.sh.
[baseline.linux-x86_64]
"acp suspend" = 142
"acp move" = 76
"acp resume" = 219
"acp pull" = 430
"claude suspend" = 177
"claude move" = 77
"claude resume" = 375
"claude pull" = 625
"codex suspend" = 230
"codex move" = 77
"codex resume" = 446
"codex pull" = 728
"cold start" = 32
"restart" = 36

# The git, kill, lsof, pgrep and ps processes each op starts in each
# warm-up run, the harness's own included: exact, and the same on every
# platform. The first run moves each job for the first time; a count that
# grows from the first run to the second grows with the job's history.
[processes]
"acp suspend" = { git = [27, 29], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [0, 0] }
"acp move" = { git = [2, 2], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [0, 0] }
"acp resume" = { git = [9, 10], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [1, 1] }
"acp pull" = { git = [41, 41], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [1, 1] }
"claude suspend" = { git = [27, 29], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [0, 0] }
"claude move" = { git = [2, 2], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [0, 0] }
"claude resume" = { git = [9, 10], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [1, 1] }
"claude pull" = { git = [41, 41], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [1, 1] }
"codex suspend" = { git = [27, 29], kill = [0, 0], lsof = [1, 1], pgrep = [0, 0], ps = [0, 0] }
"codex move" = { git = [2, 2], kill = [0, 0], lsof = [0, 0], pgrep = [0, 0], ps = [0, 0] }
"codex resume" = { git = [9, 10], kill = [0, 0], lsof = [1, 1], pgrep = [0, 0], ps = [1, 1] }
"codex pull" = { git = [41, 41], kill = [0, 0], lsof = [2, 2], pgrep = [0, 0], ps = [1, 1] }
