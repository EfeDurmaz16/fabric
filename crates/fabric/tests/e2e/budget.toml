why = "Perf items 2 and 17 of docs/evidence/perf-ab/README.md, in fabricd: the node tells whether a harness leads its process group with getpgid instead of ps -o pgid=, and finds a gone harness gone with kill(pid, 0) before it would ask ps -o lstart=. Every resume and pull starts ps once instead of three times; a check is not dropped, the same answers come without a process. Counted on that change alone and on the integration of every M2 deferred-work branch, which agree. Baselines unchanged"

