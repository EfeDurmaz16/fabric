why = "M2-06 (issue #22): a restore sets each symbolic ref with one git symbolic-ref, after the direct refs, so refs/remotes/origin/HEAD follows the remote's default branch again instead of naming a frozen commit. The job's workspace is a git clone, so it has that one symbolic ref, and every resume and pull runs one more git: resumes 17/21 and pulls 51/55. Suspends and moves are unchanged. git 2.46 and later could set it in the existing update-ref --stdin transaction; that is not built. Baselines unchanged"

