[package]
name = "fabricd"
version = "0.1.0"
description = "The Fabric node: state directory, job ledgers, the store, the network service and the control socket"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Named fault points the end-to-end test drives through FABRIC_FAULT; off
# in every build that is not a test.
faults = []

[dependencies]
fabric-core = { path = "../fabric-core" }
fabric-env = { path = "../fabric-env" }
fabric-harness = { path = "../fabric-harness" }
fabric-net = { path = "../fabric-net" }
fabric-store = { path = "../fabric-store" }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
ulid = "3.0"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
