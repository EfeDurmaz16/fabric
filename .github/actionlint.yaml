# actionlint settings. release.yml is generated by `dist generate` from
# dist-workspace.toml and is never edited by hand, so its findings are
# ignored here by name instead of patched there:
# - `uses: $/...` is GitHub's self-repository syntax (July 2026), which
#   actionlint 1.7.12 does not know yet (rhysd/actionlint#711).
# - `steps.cargo-cyclonedx.output.paths` is a typo in dist 0.34.0's template.
#   It is harmless: the SBOM is uploaded through the manifest's upload_files,
#   the line above it.
# - SC2086 and SC2129 are shellcheck style notes on dist's own scripts.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/release-smoke\.yml"'
      - 'property "output" is not defined'
      - 'SC2086'
      - 'SC2129'
