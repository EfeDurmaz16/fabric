name: release-smoke

# Called by release.yml (dist-workspace.toml: global-artifacts-jobs) after
# the archives are built and before anything is hosted, on every tag and on
# every pull request. Each archive is downloaded to a clean runner that did
# not build it and has no Rust toolchain step, and scripts/release-smoke.sh
# runs it: the checksum, the version, the CLI contract against a node it
# starts, and on macOS the quarantine behaviour the README describes. A
# failure here stops the release before the GitHub Release exists.
on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan release.yml passes to every custom job.
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # The archive is built on ubuntu-22.04; a newer image proves it
          # runs on a machine other than the one that built it.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: ${{ runner.temp }}/dist

      - name: Smoke
        env:
          TARGET: ${{ matrix.target }}
          DIST_DIR: ${{ runner.temp }}/dist
        run: scripts/release-smoke.sh "$DIST_DIR" "$TARGET"
