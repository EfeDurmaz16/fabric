name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run. Pushes to main each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit message check needs the base branch.
          fetch-depth: 0

      - name: Prove the hygiene script fires
        run: scripts/test-check-hygiene.sh

      # A pull request checks the commits since its base branch. A push to main
      # checks the commits it added, so a direct push or a merge or squash
      # commit made after the PR checks is covered too. BEFORE is all zeros
      # only when the push created main; then there is no range and only the
      # files are checked. After a force push the old head may be missing, and
      # the job fails instead of passing on an empty range.
      - name: No em dash or AI attribution in files and commits
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check-hygiene.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            scripts/check-hygiene.sh "$BEFORE"
          else
            scripts/check-hygiene.sh
          fi

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      # Only main saves the cache, so parallel PR branches do not evict it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Each adapter is a cargo feature; each one alone and none at all
      # must build clean, not only the default set.
      - name: Clippy per feature
        run: |
          for features in "" acp claude codex; do
            cargo clippy -p fabric-harness --all-targets --locked --no-default-features --features "$features" -- -D warnings
          done

      # The end-to-end test runs in the next step, so its time and its
      # failures show on their own line.
      - name: Test
        run: cargo test --workspace --locked -- --skip e2e_

      # Two fabric daemons over loopback on QUIC and on TCP+TLS: a job moved
      # and resumed, then the move broken at every named fault point.
      - name: End-to-end
        run: cargo test -p fabric --test e2e --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
