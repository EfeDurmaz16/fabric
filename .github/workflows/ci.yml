name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run. Pushes to main each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The budget check reads the CI runs an entry names when it raises
    # baselines to the anchor's times again.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit message check needs the base branch.
          fetch-depth: 0

      - name: Prove the hygiene script fires
        run: scripts/test-check-hygiene.sh

      # A pull request checks the commits since its base branch. A push to main
      # checks the commits it added, so a direct push or a merge or squash
      # commit made after the PR checks is covered too. BEFORE is all zeros
      # only when the push created main; then there is no range and only the
      # files are checked. After a force push the old head may be missing, and
      # the job fails instead of passing on an empty range.
      - name: No em dash or AI attribution in files and commits
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check-hygiene.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            scripts/check-hygiene.sh "$BEFORE"
          else
            scripts/check-hygiene.sh
          fi

      - name: Prove the fixture check fires
        run: scripts/test-check-fixtures.sh

      # ADR 0018: within one api version the client API only grows, so a
      # fixture the base already had changes only with an API_VERSION bump.
      # The base is the one the hygiene step uses; a push that created main
      # has none, and nothing is checked.
      - name: Existing fixtures change only with an api bump
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check-fixtures.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            scripts/check-fixtures.sh "$BEFORE"
          fi

      - name: Prove the budget check fires
        run: scripts/test-check-budget.sh

      # The time budget changes only with a new [[change]] entry that says
      # why, and never loosens: baselines and process counts only go down,
      # but for baselines timed again from the anchor in the CI runs the
      # entry names, which gh reads. The base is the one the hygiene step
      # uses; a push that created main has none, and nothing is checked.
      - name: The time budget changes only with a reason
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check-budget.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            scripts/check-budget.sh "$BEFORE"
          fi

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      # Only main saves the cache, so parallel PR branches do not evict it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Each adapter is a cargo feature; each one alone and none at all
      # must build clean, not only the default set.
      - name: Clippy per feature
        run: |
          for features in "" acp claude codex; do
            cargo clippy -p fabric-harness --all-targets --locked --no-default-features --features "$features" -- -D warnings
          done

      # The end-to-end test runs in the next step, so its time and its
      # failures show on their own line.
      - name: Test
        run: cargo test --workspace --locked -- --skip e2e_

      # Two fabric daemons over loopback on QUIC and on TCP+TLS: a job moved
      # and resumed, then the move broken at every named fault point.
      - name: End-to-end
        run: cargo test -p fabric --test e2e --locked

      # The hot paths against crates/fabric/tests/e2e/budget.toml, with a
      # table in the step summary. A process count that differs from the
      # budget fails on both runners, and so does a time over its limit
      # twice where the runner has baselines: linux-x86_64 holds the
      # anchor's times on ubuntu-latest. The macOS runner is not the Mac of
      # the macos-aarch64 baselines, and runs of one commit there differ by
      # up to 1.34 times, more than the 1.3 ratio, so it names a platform
      # with no baselines and only reports its times.
      - name: Time budget
        timeout-minutes: 20
        env:
          FABRIC_BUDGET: enforce
          FABRIC_BUDGET_PLATFORM: ${{ runner.os == 'macOS' && 'macos-aarch64-github' || '' }}
        run: cargo test -p fabric --test e2e --locked -- --ignored --exact budget::hot_paths --nocapture

      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The TypeScript SDK: its types, its build, its contract test against the
  # shared fixtures in protocol/fixtures, its end-to-end test against a real
  # node built from this commit, and the packed package imported by plain
  # Node 22 from node_modules.
  sdk-typescript:
    name: sdk typescript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The package test packs the SDK with npm and imports it with this
      # Node, the floor package.json names.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Install the toolchain from rust-toolchain.toml
        working-directory: .
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the node
        working-directory: .
        run: cargo build -p fabric --locked

      - name: Test
        env:
          FABRIC_BIN: ${{ github.workspace }}/target/debug/fabric
        run: bun test

  # Fabric's bridge client against the real Capsule worker
  # (crates/fabric-bridge/tests/capsule_worker.rs): every shared scenario
  # over the worker's stdio, then the client and a real journal through
  # create, exec, observe, destroy, refusals and a killed worker. The worker
  # is built from a pinned Capsule commit; bump the pin when Capsule's
  # worker changes, here and in bridge-docker. The Docker test skips here:
  # no image is on the runner, and nothing pulls one; bridge-docker runs it.
  bridge-interop:
    name: bridge interop (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EfeDurmaz16/capsule
          # Capsule's m3/bridge-worker head: the worker with the v1
          # corrections of 2026-10-29 (an exec bound of 0 refused, observe
          # with the operation's scope, exec observe and labelled seeds) and
          # its docker create, start and rm clients out of its process
          # group, which docs/evidence/m3-reconcile ran against.
          ref: a4d597aa8df665f403389bd34f592ad2ce2056c4
          path: capsule
          persist-credentials: false

      # Node 22 is the floor the worker's package.json names.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The pnpm version is the one Capsule's packageManager field pins.
      - name: Build the Capsule worker
        working-directory: capsule
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm --filter "@capsule-sdk/bridge-worker..." run build

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Bridge against the Capsule worker
        env:
          CAPSULE_BRIDGE_WORKER: ${{ github.workspace }}/capsule/packages/bridge-worker/dist/bin.js
        run: cargo test -p fabric-bridge --test capsule_worker --locked -- --ignored --nocapture

  # The bridge's Docker profile against the runner's own engine, through
  # the same Capsule worker as bridge-interop: refusals that leave no
  # container, a create with its labels and engine scope, exec and an
  # artifact within bounds, a worker killed mid-exec whose exec client
  # goes with it while the exec runs on, and a destroy that needs its own
  # grant. The worker never pulls (the profile says image_pull: never), so
  # this job pulls one tiny public image first, by digest.
  bridge-docker:
    name: bridge docker (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # busybox 1.37.0: its multi-platform index, about 2 MiB for amd64.
      BRIDGE_DOCKER_IMAGE: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EfeDurmaz16/capsule
          # The same worker as bridge-interop; move both pins together.
          ref: a4d597aa8df665f403389bd34f592ad2ce2056c4
          path: capsule
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the Capsule worker
        working-directory: capsule
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm --filter "@capsule-sdk/bridge-worker..." run build

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Pull the pinned image
        run: |
          docker version
          docker pull "$BRIDGE_DOCKER_IMAGE"

      # With CAPSULE_BRIDGE_DOCKER_IMAGE set, a missing image or an
      # unreachable engine fails the test instead of skipping it.
      - name: Docker profile against the Capsule worker
        env:
          CAPSULE_BRIDGE_WORKER: ${{ github.workspace }}/capsule/packages/bridge-worker/dist/bin.js
          CAPSULE_BRIDGE_DOCKER_IMAGE: ${{ env.BRIDGE_DOCKER_IMAGE }}
        run: cargo test -p fabric-bridge --test capsule_worker --locked -- --ignored --exact the_docker_profile_on_the_local_engine --nocapture

      - name: No container left behind
        if: always()
        run: |
          docker ps -a --filter label=fabric.job
          test -z "$(docker ps -a -q --filter label=fabric.job)"
