# A failed unwrap, expect or panic inside a test is the test failing, and a
# test may print to explain a failure.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
# clippy::exit exempts main. Binaries return ExitCode from main instead, so
# destructors run and tracing flushes.
disallowed-methods = [
  { path = "std::process::exit", reason = "return std::process::ExitCode from main so destructors run" },
]
